# DocuMind — tool configuration (install runtime deps from requirements.txt).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:.*PyPDF2 is deprecated.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
